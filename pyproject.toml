[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-investigator"
description = "Automatic PCAP Investigator - offline network capture triage and investigation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Josevmv" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
pcap-investigator = "investigator.cli:main"

[tool.setuptools]
packages = ["investigator", "investigator.detectors", "investigator.protocols"]

[tool.setuptools.package-data]
investigator = ["templates/*.j2"]

[tool.setuptools.dynamic]
version = { attr = "investigator.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
